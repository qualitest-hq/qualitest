appId: com.qualitest.desktop
productName: Qualitest
copyright: Copyright © Qualitest
forceCodeSigning: false
# 使用 yarn 已安装的 Electron，避免打包时再从 GitHub 下载 ~100MB
electronDist: ../../node_modules/electron/dist
electronVersion: 34.2.0
directories:
  buildResources: build
  output: release
files:
  - main/**
  - preload/**
  - package.json
icon: icon.ico
win:
  icon: icon.ico
  executableName: Qualitest
  # false：不触发 GitHub 下载 winCodeSign；图标在 build 前由 desktop.mjs brand 写入 electron.exe
  signAndEditExecutable: false
  signDlls: false
extraMetadata:
  name: qualitest
  description: Qualitest
  productName: Qualitest
extraResources:
  - from: build/icon.ico
    to: app-icon.ico
  - from: build/icon.png
    to: app-icon.png
  - from: ../web/dist
    to: web-dist
    filter:
      - "**/*"
