name: 提问
description: 使用、部署、配置上的疑问（先搜过 Issue / README 更好）
title: "[Q] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        部署问题可先看 [docs/deploy.md](https://github.com/qualitest-hq/qualitest/blob/main/docs/deploy.md) 与 README Quick Start。
  - type: textarea
    id: question
    attributes:
      label: 你的问题
      placeholder: 想搞清楚什么？
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 已尝试（可选）
      description: 看过哪些文档、试过什么步骤
    validations:
      required: false
  - type: dropdown
    id: run-mode
    attributes:
      label: 运行方式（可选）
      options:
        - Docker Compose 全栈
        - 本机后端 + 本机前端
        - 仅本机后端
        - 其他 / 不清楚
    validations:
      required: false
