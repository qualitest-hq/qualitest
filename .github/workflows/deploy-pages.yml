# Deploy GitHub Pages（落地页 site/）
#
# - push / workflow_dispatch：始终 build，校验 site/ 可构建
# - deploy：仅当仓库变量 ENABLE_PAGES_DEPLOY=true 时执行
#   公开日：Settings → Pages → Source = GitHub Actions
#           Settings → Secrets and variables → Actions → Variables
#           新增 ENABLE_PAGES_DEPLOY = true
#           再跑本 workflow（或 push site/）

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install and build
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_PAGES_DEPLOY == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    if: ${{ vars.ENABLE_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
