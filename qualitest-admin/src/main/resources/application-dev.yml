# =============================================================================
# 开发环境（profile=dev）
# =============================================================================

# -----------------------------------------------------------------------------
# 项目基础信息
# -----------------------------------------------------------------------------
qualitest:
  name: Qualitest
  version: 1.0.0
  copyrightYear: 2026
  profile: D:/ruoyi/uploadPath    # 本地上传文件落盘根目录
  addressEnabled: false           # 登录日志是否解析 IP 所在地
  captchaType: math             # 登录验证码类型

# -----------------------------------------------------------------------------
# 内嵌 Tomcat
# -----------------------------------------------------------------------------
server:
  port: 8080                    # HTTP 端口
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000          # 连接满后排队长度
    threads:
      max: 800
      min-spare: 100

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
logging:
  level:
    com.qualitest: debug
    org.springframework: warn

# -----------------------------------------------------------------------------
# 账户口令安全
# -----------------------------------------------------------------------------
user:
  password:
    maxRetryCount: 5            # 最大连续错误次数
    lockTime: 10                # 锁定时长（分钟）

# -----------------------------------------------------------------------------
# Spring 通用
# -----------------------------------------------------------------------------
spring:
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true             # 开发热重启
  data:
    redis:
      host: localhost
      port: 6379
      database: 10              # 逻辑库号
      password:
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: jdbc:mysql://localhost:3306/qualitest?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
        username: root
        password: 123456
      slave:
        enabled: false
        url:
        username:
        password:
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username: ruoyi
        login-password: 123456
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

# -----------------------------------------------------------------------------
# JWT（管理后台会话）
# -----------------------------------------------------------------------------
token:
  header: Authorization
  secret: abcdefghijklmnopqrstuvwxyz
  expireTime: 1440              # Token 有效期（分钟，默认一天）

# -----------------------------------------------------------------------------
# MyBatis
# -----------------------------------------------------------------------------
mybatis:
  typeAliasesPackage: com.qualitest.**.domain,com.qualitest.**.params,com.qualitest.**.result
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

# -----------------------------------------------------------------------------
# 分页插件
# -----------------------------------------------------------------------------
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# -----------------------------------------------------------------------------
# OpenAPI / Swagger UI
# -----------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.qualitest.web.controller.tool

# -----------------------------------------------------------------------------
# 防盗链
# -----------------------------------------------------------------------------
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

# -----------------------------------------------------------------------------
# XSS 过滤
# -----------------------------------------------------------------------------
xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*
