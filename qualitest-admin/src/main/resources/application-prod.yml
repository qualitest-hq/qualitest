# =============================================================================
# 生产环境（profile=prod）
# =============================================================================

qualitest:
  name: Qualitest
  version: 1.4.3
  copyrightYear: 2026
  profile: ${QUALITEST_PROFILE:/home/qualitest/uploadPath}   # Linux 部署上传目录
  addressEnabled: false
  captchaType: math

server:
  port: ${SERVER_PORT:8800}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.qualitest: ${LOGGING_LEVEL_COM_QUALITEST:info}           # 生产降低日志量
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: false              # 生产关闭热部署
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:10}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  flyway:
    enabled: true
    # Druid 多数据源时须显式指定，与 master 一致；生产须注入环境变量
    url: ${SPRING_DATASOURCE_DRUID_MASTER_URL:jdbc:mysql://localhost:3306/qualitest?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
    user: ${SPRING_DATASOURCE_DRUID_MASTER_USERNAME:root}
    password: ${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD:}
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    validate-on-migrate: true
    encoding: UTF-8
    out-of-order: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: ${SPRING_DATASOURCE_DRUID_MASTER_URL:jdbc:mysql://localhost:3306/qualitest?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
        username: ${SPRING_DATASOURCE_DRUID_MASTER_USERNAME:root}
        password: ${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD:}          # 生产必须通过环境变量注入
      slave:
        enabled: false
        url:
        username:
        password:
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: false            # 关闭 Web 统计暴露
      statViewServlet:
        enabled: false            # 关闭 /druid 控制台
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

token:
  header: Authorization
  secret: ${TOKEN_SECRET:}  # 生产必须通过环境变量注入强随机密钥
  expireTime: 10080             # Token 有效期（分钟，7 天）

mybatis:
  typeAliasesPackage: com.qualitest.**.domain,com.qualitest.**.params,com.qualitest.**.result
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false                # 生产关闭在线 API 文档
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.qualitest.web.controller.tool

referer:
  enabled: true                   # 生产开启防盗链
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

ai:
  llm:
    allow-private-base-url: false
    discover-cache-ttl: 3600
    models-dev:
      enabled: true
      api-url: https://models.dev/api.json
      models-url: https://models.dev/models.json
      cache-ttl-seconds: 86400
