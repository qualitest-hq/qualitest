# 质衡 Qualitest — Docker Compose 全栈
# 用法：
#   docker compose up -d --build     # 全栈（MySQL + Redis + 后端 + Nginx）
#   docker compose up -d mysql redis # 仅依赖（本机跑 mvn / yarn）
# 一键脚本见 scripts/quick-start.sh|.bat
# 靶场：独立仓 qualitest-demo 另起 Compose（本文件无 --profile demo；见 docs/deploy.md）

name: qualitest

services:
  mysql:
    image: mysql:8.0
    container_name: qualitest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qualitest}
      MYSQL_DATABASE: qualitest
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    # 仅建空库 MYSQL_DATABASE=qualitest；表结构与种子由 app 启动时 Flyway 迁移
    # 已有脏卷若需重建：docker compose down -v（会丢数据）或对存量库走 baseline（见 docs/flyway.md §7）
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: qualitest-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qualitest-hq/qualitest-app:${QUALITEST_IMAGE_TAG:-latest}
    container_name: qualitest-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      QUALITEST_PROFILE: /data/upload
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/qualitest?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qualitest}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_DATABASE: "0"
      SPRING_DATA_REDIS_PASSWORD: ""
      TOKEN_SECRET: ${TOKEN_SECRET:-qualitest-compose-dev-change-me-32chars!!}
      LOGGING_LEVEL_COM_QUALITEST: ${LOGGING_LEVEL_COM_QUALITEST:-info}
    volumes:
      - upload_data:/data/upload
    # 调试时可解开：宿主机直连后端
    # ports:
    #   - "8080:8080"

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    image: qualitest-hq/qualitest-web:${QUALITEST_IMAGE_TAG:-latest}
    container_name: qualitest-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql_data:
  redis_data:
  upload_data:
